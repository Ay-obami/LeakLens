[package]
name = "leaklens-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
leaklens-core = { path = "../leaklens-core" }
leaklens-gate = { path = "../leaklens-gate" }
leaklens-zcash = { path = "../leaklens-zcash" }
leaklens-wallet = { path = "../leaklens-wallet" }
zcash_client_backend.workspace = true
zcash_keys.workspace = true
zcash_protocol.workspace = true
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"] }
secrecy = "0.8"

[dev-dependencies]
sapling = { package = "sapling-crypto", version = "0.9" }
