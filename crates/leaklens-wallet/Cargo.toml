[package]
name = "leaklens-wallet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = "=0.37.0"
secrecy = "=0.8.0"
zcash_client_backend = { workspace = true, features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "=0.22.0", features = ["orchard", "transparent-inputs"] }
zcash_keys = { workspace = true, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol.workspace = true
zcash_transparent = "=0.10.0"

futures-util = "0.3"
prost = "0.14"
tonic = { version = "0.14", features = ["transport", "tls-webpki-roots"] }
sapling = { package = "sapling-crypto", version = "0.7" }
orchard.workspace = true
zcash_primitives.workspace = true

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tempfile = "3"
